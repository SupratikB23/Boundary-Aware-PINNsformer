# S_net: (x, y, t) -> non-negative interior source S (PRD §2.2).
depth: 3
width: 32
activation: tanh
output_transform: softplus
fourier_features: 8
l1_weight: 1.0              # relative weight of mean|S_hat| inside L_reg (dimensionless)
tv_weight: 0.0              # reserved (TV not used by the trainer)
