[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bapinnsformer"
version = "0.0.1"
description = "Boundary-Aware PINNsformer: observation-driven recovery of transboundary pollutant inflow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
authors = [{ name = "BBM Research" }]
dependencies = [
  "torch==2.3.1",
  "numpy==1.26.4",
  "scipy==1.13.1",
  "pandas==2.2.2",
  "polars==1.3.0",
  "xarray==2024.7.0",
  "netCDF4==1.6.5",
  "cdsapi==0.7.0",
  "geopandas==1.0.1",
  "pyproj==3.6.1",
  "matplotlib==3.9.2",
  "pyyaml==6.0.2",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "pytest==8.3.1",
]

[project.optional-dependencies]
dev = [
  "ruff==0.5.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
